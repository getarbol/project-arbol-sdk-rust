name: Verify

# Formatting, Clippy and the crate's tests (cargo), and the generation tests (bun), which run the pinned
# Cloudflare Forge and the plugin over a synthetic OpenAPI.
on:
  repository_dispatch:
    types: [openapi-release]
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-sdk-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A cold run builds Forge with cargo.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Compare the deployed specification
        id: contract
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: |
          bun run openapi
          if [ "$(bun scripts/openapi-hash.ts openapi.json)" = "$(jq -r .openapiContentSha256 src/generated/generation.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust (rust-toolchain.toml)
        if: steps.contract.outputs.changed != 'false'
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          cargo --version
      - if: steps.contract.outputs.changed != 'false'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .forge
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'generation/forge-lock.json', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - if: steps.contract.outputs.changed != 'false'
        run: bun install --frozen-lockfile
      - if: steps.contract.outputs.changed != 'false'
        run: bun run forge
      - if: steps.contract.outputs.changed == 'true'
        run: bun run generate
      - if: steps.contract.outputs.changed != 'false'
        run: bun run verify
      - name: Create a repository-scoped Arbol Bot token
        if: steps.contract.outputs.changed == 'true'
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ARBOL_BOT_APP_ID }}
          private-key: ${{ secrets.ARBOL_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish the verified Git dependency
        if: steps.contract.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh auth setup-git
          release="$(jq -r .release src/generated/generation.json)"
          git add Cargo.toml src/generated
          git -c user.name='Arbol Bot' -c user.email='support@getarbol.com' commit -m "Regenerate the Rust SDK for OpenAPI $release"
          git push origin HEAD:main
