name: Verify

# Formatting, Clippy and the crate's tests (cargo), and the generation tests (bun), which run the pinned
# Cloudflare Forge and the plugin over a synthetic OpenAPI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold run builds Forge with cargo.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install Rust (rust-toolchain.toml)
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          cargo --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .forge
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'generation/forge-lock.json', 'Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run forge
      - run: bun run verify
