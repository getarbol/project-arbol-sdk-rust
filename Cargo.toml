[package]
name = "arbol-sdk"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Arbol API over HTTPS for Rust, generated by Cloudflare Forge from the platform's public OpenAPI."
license = "Apache-2.0"
repository = "https://github.com/getarbol/project-arbol-sdk-rust"
homepage = "https://github.com/getarbol/project-arbol-sdk-rust#readme"
readme = "README.md"
keywords = ["arbol", "sdk", "api", "openapi", "client"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src", "/README.md", "/LICENSE"]
# Installed from git for now; nothing goes to crates.io by accident.
publish = false

# The OpenAPI src/generated/ was generated from (`bun run generate` writes it): its info.version, and the
# SHA-256 of its canonical JSON without info.version (generation/openapi-hash.ts).
[package.metadata.arbol.openapi]
release = "1.20261111.205940"
sha256 = "97756a7305948ba3086f980b2109847a2733b03f0245b151dff3aea1e0a6f334"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
